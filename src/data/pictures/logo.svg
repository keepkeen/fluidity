<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303E60"/>
      <stop offset="0.55" stop-color="#1C2438"/>
      <stop offset="1" stop-color="#111624"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.74" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#78A0D7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#78A0D7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.23" cy="0.84" r="0.7">
      <stop offset="0" stop-color="#080A12" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#080A12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE0B0"/>
      <stop offset="1" stop-color="#F0A868"/>
    </linearGradient>
    <filter id="glow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="blur"/>
      <feFlood flood-color="#FFC482" flood-opacity="0.9"/>
      <feComposite in2="blur" operator="in" result="halo"/>
      <feMerge>
        <feMergeNode in="halo"/>
        <feMergeNode in="halo"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="tileClip"><rect x="20" y="20" width="472" height="472" rx="110"/></clipPath>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="110" fill="url(#bg)"/>
  <g clip-path="url(#tileClip)">
    <rect width="512" height="512" fill="url(#moon)"/>
    <rect width="512" height="512" fill="url(#shade)"/>
  </g>
  <rect x="21.5" y="21.5" width="469" height="469" rx="108.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>

  <g>
    <rect x="138" y="138" width="96" height="96" rx="28" fill="#E2EAF8" fill-opacity="0.28" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2.5"/>
    <rect x="278" y="138" width="96" height="96" rx="28" fill="#E2EAF8" fill-opacity="0.28" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2.5"/>
    <rect x="138" y="278" width="96" height="96" rx="28" fill="#E2EAF8" fill-opacity="0.28" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2.5"/>
    <rect x="278" y="278" width="96" height="96" rx="28" fill="url(#warm)" stroke="#FFE8C8" stroke-opacity="0.65" stroke-width="2.5" filter="url(#glow)"/>
  </g>
</svg>
